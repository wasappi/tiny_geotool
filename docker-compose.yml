services:
  db:
    image: postgres:16  # keep in sync with accessories.db.image in config/deploy.yml
    environment:
      POSTGRES_USER: geotool
      POSTGRES_PASSWORD: geotool
      POSTGRES_DB: geotool
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geotool -d geotool"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
