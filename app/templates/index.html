<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Geotool</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.33.0/mapbox-gl.js"></script>
    <script defer src="{{ url_for('static', path='js/map.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="{{ url_for('static', path='js/charts.js') }}"></script>
</head>

<body>
    {% include "partials/navbar.html" %}

    <div class="container-fluid mt-3 px-4">
        <div class="row">

            <!-- LEFT SIDEBAR -->
            <div class="col-md-4 border-end pe-3 mb-3">
                <div id="map" class="rounded mb-3" data-token="{{ mapbox_token }}"></div>
                <form hx-post="/analysis" hx-target="#raster-analysis-response" hx-swap="innerHTML" ,
                    hx-indicator="#analyse-spinner" , hx-disabled-elt="#analyse-btn, #datetime_month">
                    <div class="mb-3">
                        <label for="datetime_month" class="form-label">Month</label>
                        <input type="month" id="datetime_month" name="datetime_month" value="{{ current_month }}"
                            class="form-control form-control-sm font-monospace" required>
                    </div>

                    <div class="mb-3">
                        <label for="bbox" class="form-label">Bbox</label>
                        <input type="text" id="bbox" name="bbox"
                            class="form-control form-control-sm font-monospace bg-light" readonly required
                            placeholder="min_lon,min_lat,max_lon,max_lat">
                    </div>

                    <button type="submit" id="analyse-btn" class="btn btn-primary w-100">
                        <span id="analyse-spinner" class="htmx-indicator spinner-border spinner-border-sm me-2"
                            role="status"></span>
                        Analyse
                    </button>
                </form>
            </div>

            <!-- RIGHT PANEL -->
            <div id="details-panel" class="col-md-8 ps-2">
                <div id="raster-analysis-response">
                    <div class="card border-0 shadow-sm rounded-4 bg-body-tertiary">
                        <div class="card-body d-flex align-items-center gap-3 py-3">
                            <div class="rounded-3 bg-success-subtle text-success p-2 lh-1">
                                <i class="bi bi-tree fs-4"></i>
                            </div>
                            <div>
                                <h6 class="mb-1">Welcome</h6>
                                <p class="text-muted small mb-0">
                                    Frame an area on the map, pick a month, then press <strong>Analyse</strong>
                                    to explore vegetation cover from Sentinel-2 imagery.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>


</html>
